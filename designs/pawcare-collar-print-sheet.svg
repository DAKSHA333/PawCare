<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508">
  <defs>
    <style>
      .sheet-bg{fill:#f7f8f4}
      .title{font:800 78px Segoe UI,Arial,sans-serif;fill:#263b34;letter-spacing:-2px}
      .subtitle{font:500 34px Segoe UI,Arial,sans-serif;fill:#62756c}
      .small{font:600 28px Segoe UI,Arial,sans-serif;fill:#6f8078}
      .micro{font:600 21px Segoe UI,Arial,sans-serif;fill:#789084;letter-spacing:1px}
      .brand{font:900 50px Segoe UI,Arial,sans-serif;fill:#243933;letter-spacing:-1px}
      .pawcare{font:900 42px Segoe UI,Arial,sans-serif;fill:#243933;letter-spacing:-1px}
      .write{font:800 40px Segoe UI,Arial,sans-serif;fill:#263b34}
      .guide{font:600 24px Segoe UI,Arial,sans-serif;fill:#96a59c}
      .cut{fill:none;stroke:#b8c5bd;stroke-width:4;stroke-dasharray:22 18}
      .band{fill:#fffdf8;stroke:#263b34;stroke-width:7}
      .band-shadow{fill:#dfe8de}
      .orange{fill:#ed7146}
      .green{fill:#4d8d79}
      .cream{fill:#fff4e6}
      .qr{fill:#fff;stroke:#263b34;stroke-width:6}
      .qr-line{stroke:#263b34;stroke-width:16;stroke-linecap:round}
      .writebox{fill:#fff;stroke:#cbd7ce;stroke-width:5}
      .laminate{fill:none;stroke:#7ba089;stroke-width:4;stroke-dasharray:15 13}
      .hole{fill:#fff;stroke:#263b34;stroke-width:5}
      .heart{fill:#ed7146}
      .paw{fill:#4d8d79}
    </style>
    <g id="paw">
      <circle cx="0" cy="0" r="12"/>
      <circle cx="-18" cy="-15" r="8"/>
      <circle cx="0" cy="-22" r="8"/>
      <circle cx="18" cy="-15" r="8"/>
    </g>
    <g id="qr-placeholder">
      <rect class="qr" x="0" y="0" width="210" height="210" rx="18"/>
      <path class="qr-line" d="M46 65h45v45H46zM119 65h45v45h-45zM46 137h45v29H46zM119 137h45M137 137v30"/>
      <text class="guide" x="105" y="238" text-anchor="middle">PASTE QR</text>
    </g>
    <g id="collar">
      <rect class="band-shadow" x="12" y="18" width="1040" height="390" rx="44"/>
      <rect class="band" x="0" y="0" width="1040" height="390" rx="44"/>
      <rect class="laminate" x="28" y="28" width="984" height="334" rx="30"/>
      <circle class="hole" cx="75" cy="195" r="24"/>
      <circle class="hole" cx="965" cy="195" r="24"/>
      <rect class="cream" x="120" y="46" width="790" height="298" rx="28"/>
      <use href="#qr-placeholder" x="152" y="82"/>
      <text class="pawcare" x="405" y="115">PAWCARE</text>
      <text class="micro" x="405" y="151">SCAN FOR PUBLIC CARE PROFILE</text>
      <rect class="writebox" x="405" y="177" width="435" height="74" rx="14"/>
      <text class="write" x="424" y="229">PAW-</text>
      <path d="M528 218h280" stroke="#263b34" stroke-width="4" stroke-linecap="round"/>
      <text class="guide" x="424" y="281">write: BLR-JPN-000124</text>
      <rect class="writebox" x="405" y="292" width="435" height="48" rx="12"/>
      <text class="small" x="424" y="326">TAG / COLLAR ID:</text>
      <path d="M655 318h150" stroke="#263b34" stroke-width="3" stroke-linecap="round"/>
      <use class="paw" href="#paw" x="875" y="120"/>
      <path class="heart" d="M880 230c-28-28 12-68 39-35 26-33 67 7 39 35l-39 39z"/>
    </g>
  </defs>
  <rect class="sheet-bg" width="2480" height="3508"/>
  <text class="title" x="150" y="165">PawCare Printable Collar Tags</text>
  <text class="subtitle" x="150" y="225">Print, laminate, cut, attach to collar. Write the ID with a permanent marker.</text>
  <text class="small" x="150" y="286">Writable format: PAW-__________  ·  TAG / COLLAR ID: ________</text>
  <g transform="translate(150 390)">
    <use href="#collar" x="0" y="0"/>
    <use href="#collar" x="1140" y="0"/>
    <use href="#collar" x="0" y="520"/>
    <use href="#collar" x="1140" y="520"/>
    <use href="#collar" x="0" y="1040"/>
    <use href="#collar" x="1140" y="1040"/>
    <rect class="cut" x="-35" y="-35" width="1110" height="460" rx="60"/>
    <rect class="cut" x="1105" y="-35" width="1110" height="460" rx="60"/>
    <rect class="cut" x="-35" y="485" width="1110" height="460" rx="60"/>
    <rect class="cut" x="1105" y="485" width="1110" height="460" rx="60"/>
    <rect class="cut" x="-35" y="1005" width="1110" height="460" rx="60"/>
    <rect class="cut" x="1105" y="1005" width="1110" height="460" rx="60"/>
  </g>
  <g transform="translate(150 2050)">
    <rect x="0" y="0" width="2180" height="980" rx="42" fill="#fff" stroke="#dce6dd" stroke-width="5"/>
    <text class="brand" x="70" y="105">Durable print notes</text>
    <text class="subtitle" x="70" y="170">Use waterproof synthetic paper or print on sticker paper and laminate both sides.</text>
    <text class="subtitle" x="70" y="230">Cut on the dotted line, punch the side holes, and attach with a zip tie, rivet, or split ring.</text>
    <text class="subtitle" x="70" y="290">Use a black permanent marker for the handwritten ID. Cover the writing with clear tape for field durability.</text>
    <rect x="70" y="380" width="950" height="430" rx="35" fill="#f7fbf4" stroke="#cfdccd" stroke-width="5"/>
    <text class="brand" x="125" y="470">Example write-in</text>
    <rect class="writebox" x="125" y="520" width="720" height="90" rx="16"/>
    <text class="write" x="150" y="580">PAW-BLR-JPN-000124</text>
    <rect class="writebox" x="125" y="650" width="520" height="70" rx="14"/>
    <text class="write" x="150" y="700">PC-1000</text>
    <rect x="1130" y="380" width="950" height="430" rx="35" fill="#fff7ee" stroke="#f0c7ac" stroke-width="5"/>
    <text class="brand" x="1185" y="470">What goes on the collar</text>
    <text class="subtitle" x="1185" y="540">1. Printed PawCare collar tag</text>
    <text class="subtitle" x="1185" y="600">2. QR code downloaded from the app</text>
    <text class="subtitle" x="1185" y="660">3. Handwritten PawCare ID and tag ID</text>
    <text class="subtitle" x="1185" y="720">4. Optional clear pouch for rainy weather</text>
  </g>
</svg>
